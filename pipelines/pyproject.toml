[project]
name = "ledger-pipelines"
version = "0.1.0"
description = "Project Ledger ingestion, cost-model engine, and FOI tooling"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Heavier deps pulled in only where needed (extraction, PDF parsing, DB writes).
full = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "supabase>=2.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
